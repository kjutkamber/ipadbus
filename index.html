<div id="flt" class="modal" style="display:none"><div class="box"><h1>Linije na stanici</h1>
  <div class="mut" style="font-size:14px;margin-bottom:8px">Sve linije koje prolaze kroz stanicu (po OpenStreetMap-u, plus viđene uživo). Ako ništa ne menjaš, prikazuju se sve.</div>

<script>
var API='https://nycbus.stevan-gajinov5.workers.dev',CITY='ns',REFRESH=15000;
var COLORS=['#0039a6','#ff6319','#6cbe45','#b933ad','#ee352e','#00933c','#00add0','#996633','#fccc0a','#e6007e','#1b998b','#7a5195','#f2542d','#3a86ff'];
function $(id){return document.getElementById(id)}
function show(id,on){$(id).style.display=on?'':'none'}
function color(n){var h=0,s=String(n);for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%997;return COLORS[h%COLORS.length]}
function fmt(s){return s<60?'sad':Math.round(s/60)+' min'}
function agoTxt(s){return s<60?s+' s':Math.floor(s/60)+' min'}
function nat(a,b){var x=parseInt(a,10),y=parseInt(b,10);if(!isNaN(x)&&!isNaN(y)&&x!==y)return x-y;return a<b?-1:(a>b?1:0)}
function indexOf(a,v){for(var i=0;i<a.length;i++)if(a[i]==v)return i;return -1}

/* XHR umesto fetch-a (iOS 9 nema fetch) */
function api(path,ok,fail){
  var x=new XMLHttpRequest();x.open('GET',API+path,true);x.timeout=15000;
  x.onload=function(){var j;try{j=JSON.parse(x.responseText)}catch(e){fail('neispravan odgovor');return}
    if(x.status>=200&&x.status<300)ok(j);else fail((j&&j.error)||x.status)};
  x.onerror=function(){fail('mreža – nema veze sa serverom (proveri internet ili HTTPS sertifikat)')};x.ontimeout=function(){fail('vreme isteklo')};
  x.send();
}
function showErr(el,e){
  el.innerHTML='';var m=document.createElement('div');m.className='msg err';m.textContent='Greška: '+e;el.appendChild(m);
  if(String(e).indexOf('mreža')===0){
    var a=document.createElement('a');a.href=API+'/api/cities';a.target='_blank';a.style.color='#ffb000';
    a.textContent='Dodirni da testiraš vezu sa serverom';var p=document.createElement('div');p.className='msg';p.appendChild(a);el.appendChild(p)}
}
/* Overpass (OpenStreetMap): linije koje prolaze kroz stanicu */
var OVP=['https://overpass-api.de/api/interpreter','https://overpass.private.coffee/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
function overpass(q,ok,fail,i){
  i=i||0;if(i>=OVP.length)return fail('Overpass nedostupan');
  var x=new XMLHttpRequest();x.open('POST',OVP[i],true);x.timeout=45000;
  x.setRequestHeader('Content-Type','application/x-www-form-urlencoded');
  x.onload=function(){var j;try{j=JSON.parse(x.responseText)}catch(e){return overpass(q,ok,fail,i+1)}
    if(x.status>=200&&x.status<300)ok(j);else overpass(q,ok,fail,i+1)};
  x.onerror=x.ontimeout=function(){overpass(q,ok,fail,i+1)};
  x.send('data='+encodeURIComponent(q));
}
/* ---- smer: relacije (smerovi) iz OpenStreetMap-a koje staju na stanici ---- */
var PV=2; // verzija pamćenih podataka o linijama po smeru (f.pv)
var CYR={'а':'a','б':'b','в':'v','г':'g','д':'d','ђ':'dj','е':'e','ж':'z','з':'z','и':'i','ј':'j','к':'k','л':'l','љ':'lj','м':'m','н':'n','њ':'nj','о':'o','п':'p','р':'r','с':'s','т':'t','ћ':'c','у':'u','ф':'f','х':'h','ц':'c','ч':'c','ш':'s','џ':'dz','č':'c','ć':'c','š':'s','ž':'z','đ':'dj'};
function toks(s){var t=String(s||'').toLowerCase().replace(/[а-џčćšžđ]/g,function(c){return CYR[c]||c}).split(/[^a-z0-9]+/),o=[];for(var i=0;i<t.length;i++)if(t[i])o.push(t[i]);return o}
function one(x,Y){var b=0;for(var i=0;i<Y.length;i++){var y=Y[i],
  v=x===y?1:((x.length>=3&&y.indexOf(x)===0)||(y.length>=3&&x.indexOf(y)===0))?0.8:((x.length===1&&y.charAt(0)===x)||(y.length===1&&x.charAt(0)===y))?0.4:0;
  if(v>b)b=v}return b}
function sim(a,b){var A=toks(a),B=toks(b),t=0,i;if(!A.length||!B.length)return 0;
  for(i=0;i<A.length;i++)t+=one(A[i],B);for(i=0;i<B.length;i++)t+=one(B[i],A);return t/(A.length+B.length)}
function ends(s){var p=String(s||'').split(/\s*(?:=>|->|→|⇒|➔|–|—)\s*|\s+-\s+/),o=[];
  for(var i=0;i<p.length;i++){var x=p[i].replace(/^\s+|\s+$/g,'');if(x)o.push(x)}
  return o.length?{fr:o[0],to:o[o.length-1]}:{fr:'',to:''}}
function relEnds(r){ // početak/kraj relacije: tagovi from/to, a ako ih nema, iz imena "Autobus 2: A => B"
  var fr=r.fr||'',to=r.to||'';
  if(!to){var p=ends(String(r.nm||'').replace(/^[^:]*:/,''));if(p.fr&&p.to&&p.fr!==p.to){fr=fr||p.fr;to=p.to}}
  return {fr:fr,to:to}}
function pickDirs(dirs,l){ // od smerova iz rasporeda ostavi samo onaj koji odgovara stanici (ako je siguran)
  if(dirs.length<2)return dirs;
  var hints=[],i,j,rel=l.rel||[];
  for(i=0;i<rel.length;i++)if(rel[i].to)hints.push([rel[i].fr,rel[i].to]);
  if(l.title){var w=String(l.title).replace(/^\s+|\s+$/g,'').split(/\s+/);if(w[0].toUpperCase()==String(l.number).toUpperCase())w.shift();
    var e=ends(w.join(' '));if(e.to&&e.fr!==e.to)hints.push([e.fr,e.to])} // naslov viđenog vozila na ovoj stanici
  if(!hints.length)return dirs;
  var sc=[],best=-1,second=-1,bi=-1;
  for(i=0;i<dirs.length;i++){var de=ends(dirs[i].label),m=0;
    for(j=0;j<hints.length;j++){var v=2*sim(hints[j][1],de.to)+((hints[j][0]&&de.fr)?sim(hints[j][0],de.fr):0);if(v>m)m=v}
    if(m>best){second=best;best=m;bi=i}else if(m>second)second=m}
  return (best>=1.2&&best-second>=0.8)?[dirs[bi]]:dirs}
function stationQuery(s){
  var la=s.lat,lo=s.lon,bb=[la-0.018,lo-0.026,la+0.018,lo+0.026].join(',');
  return '[out:json][timeout:40];node(around:35,'+la+','+lo+')->.n;rel(bn.n)[route~"^(bus|trolleybus)$"]->.a;'+
    'way(around:35,'+la+','+lo+')->.w;rel(bw.w)[route~"^(bus|trolleybus)$"]->.b;(.a;.b;)->.all;.all out geom('+bb+');'}
function parseRels(j){
  var el=j.elements||[],out=[],i,k,q;
  for(i=0;i<el.length;i++){var e=el[i];if(e.type!=='relation'||!e.tags||!e.tags.ref)continue;
    var r={ref:e.tags.ref,nm:e.tags.name||'',fr:e.tags.from||'',to:e.tags.to||'',s:[],w:[]},m=e.members||[];
    for(k=0;k<m.length;k++){var x=m[k],role=x.role||'';
      if(x.type==='node'&&x.lat!==undefined&&/stop|platform/.test(role)){r.s.push([x.lat,x.lon]);continue}
      if(x.type!=='way'||!x.geometry)continue;
      var segs=[],seg=[];
      for(q=0;q<x.geometry.length;q++){var p=x.geometry[q];
        if(p&&p.lat!==undefined)seg.push([p.lat,p.lon]);else{if(seg.length>1)segs.push(seg);seg=[]}} // tačke van okvira su null
      if(seg.length>1)segs.push(seg);
      if(!segs.length)continue;
      if(/platform/.test(role)){var g0=segs[0];r.s.push(g0[Math.floor(g0.length/2)]);continue} // peron kao površina: sredina
      for(q=0;q<segs.length;q++)r.w.push(segs[q])}
    out.push(r)}
  return out}
function dist(s,p){var dx=(p[1]-s.lon)*111320*Math.cos(s.lat*Math.PI/180),dy=(p[0]-s.lat)*110540;return Math.sqrt(dx*dx+dy*dy)}
function segD(s,a,b){var k=111320*Math.cos(s.lat*Math.PI/180),ax=(a[1]-s.lon)*k,ay=(a[0]-s.lat)*110540,bx=(b[1]-s.lon)*k,by=(b[0]-s.lat)*110540,
  dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy,u=l?Math.max(0,Math.min(1,-(ax*dx+ay*dy)/l)):0,ex=ax+u*dx,ey=ay+u*dy;return Math.sqrt(ex*ex+ey*ey)}
function nearWay(s,g,m){for(var i=1;i<g.length;i++)if(segD(s,g[i-1],g[i])<m)return true;return false}
function servedBy(s,rs){ // relacije koje staju na stanici (najbliže stajalište ≤35 m), ili samo po geometriji
  var d=[],best=Infinity,i,j,out=[];
  for(i=0;i<rs.length;i++){var m=Infinity;for(j=0;j<rs[i].s.length;j++){var dd=dist(s,rs[i].s[j]);if(dd<m)m=dd}d.push(m);if(m<best)best=m}
  if(best<=35){for(i=0;i<rs.length;i++)if(d[i]<=best+6)out.push(rs[i]);return {rels:out,exact:true}}
  for(i=0;i<rs.length;i++){for(j=0;j<rs[i].w.length;j++)if(nearWay(s,rs[i].w[j],35)){out.push(rs[i]);break}}
  return out.length?{rels:out,exact:false}:null}
function simp(g){ // proredi tačke (na ~15 m) da mapa bude laka
  var o=[[+g[0][0].toFixed(5),+g[0][1].toFixed(5)]],last=g[0];
  for(var i=1;i<g.length;i++){var p=g[i],dx=(p[1]-last[1])*78000,dy=(p[0]-last[0])*110540;
    if(dx*dx+dy*dy>=225||i===g.length-1){o.push([+p[0].toFixed(5),+p[1].toFixed(5)]);last=p}}
  return o}
function waysOf(rels){var out=[],seen={};
  for(var i=0;i<rels.length;i++)for(var j=0;j<rels[i].w.length;j++){var g=rels[i].w[j],k=g.length+'|'+g[0]+'|'+g[g.length-1];
    if(!seen[k]){seen[k]=1;out.push(simp(g))}}
  return out}
function analyze(s,rels){ // → {pass:[linije], rel:{linija:[{fr,to}]}, geo:{linija:[trase]}}
  var by={},refs=[],pass=[],rel={},geo={},i,j;
  for(i=0;i<rels.length;i++){var r=rels[i];if(!by[r.ref]){by[r.ref]=[];refs.push(r.ref)}by[r.ref].push(r)}
  for(i=0;i<refs.length;i++){var sb=servedBy(s,by[refs[i]]);if(!sb)continue;
    pass.push(refs[i]);
    if(sb.exact){var e=[];for(j=0;j<sb.rels.length;j++)e.push(relEnds(sb.rels[j]));rel[refs[i]]=e}
    geo[refs[i]]=waysOf(sb.rels)}
  pass.sort(nat);return {pass:pass,rel:rel,geo:geo}}
var GEO={};
function loadGeo(uid){if(GEO[uid])return GEO[uid];
  try{var g=JSON.parse(localStorage.getItem('geo_'+uid)||'null');if(g&&g.pv===PV)return GEO[uid]=g.by}catch(e){}return null}
function stationOf(f){if(!ST)return null;for(var i=0;i<ST.length;i++)if(ST[i].uid==f.uid)return ST[i];return null}
function passFor(f,cb){
  if(f.pass&&f.pv===PV)return cb(f.pass,'');
  stations(function(){
    var s=stationOf(f);if(!s)return cb([],'stanica nije pronađena');
    overpass(stationQuery(s),function(j){
      var a=analyze(s,parseRels(j));
      f.pass=a.pass;f.rel=a.rel;f.pv=PV;save();
      GEO[f.uid]=a.geo;try{localStorage.setItem('geo_'+f.uid,JSON.stringify({pv:PV,by:a.geo}))}catch(e){}
      cb(a.pass,'');
    },function(e){cb([],e)});
  },function(e){cb([],e)});
}
var ST=null,stQ=[];
function stations(cb,fail){
  if(ST)return cb(ST);
  stQ.push([cb,fail]);if(stQ.length>1)return;
  api('/api/stations?city='+CITY,function(j){ST=j;var q=stQ;stQ=[];for(var i=0;i<q.length;i++)q[i][0](ST)},
    function(e){var q=stQ;stQ=[];for(var i=0;i<q.length;i++)q[i][1](e)});
}
var favs=[];
try{var raw=JSON.parse(localStorage.getItem('favs')||'[]');for(var i=0;i<raw.length;i++)if((raw[i].city||CITY)==CITY)favs.push(raw[i])}catch(e){}
function save(){try{localStorage.setItem('favs',JSON.stringify(favs))}catch(e){}}
function favOf(f){for(var i=0;i<favs.length;i++)if(favs[i].uid==f.uid)return favs[i];return f}
function isFav(f){for(var i=0;i<favs.length;i++)if(favs[i].uid==f.uid)return true;return false}

var cur=null,timer=null,bodies=[],lastOk=0,nextAt=0;

/* ---- status sinhronizacije ---- */
function renderSync(){
  var t;
  if(!lastOk)t='Učitavam…';
  else{var ago=Math.max(0,Math.round((Date.now()-lastOk)/1000)),left=Math.max(0,Math.ceil((nextAt-Date.now())/1000));
    t='Sinhronizovano pre '+agoTxt(ago)+' · osvežavanje '+(left?'za '+left+' s':'…')}
  $('hsync').textContent=t;$('dsync').textContent=t;
}
setInterval(renderSync,1000);
function startTimer(fn){
  if(timer)clearInterval(timer);nextAt=Date.now()+REFRESH;
  timer=setInterval(function(){nextAt=Date.now()+REFRESH;fn()},REFRESH);renderSync();
}

function go(v,f){
  cur=f||null;if(timer){clearInterval(timer);timer=null}lastOk=0;
  show('home',v=='home');show('add',v=='add');show('detail',v=='detail');
  if(v=='home'){buildHome();startTimer(refreshHome)}
  if(v=='detail'){$('dname').textContent=f.name;$('dlist').innerHTML='';MAP.R=0;LASTLINES=[];show('mapbox',MAPON);$('mbtn').style.background=MAPON?'#2a2a2a':'';
    refreshDetail();startTimer(refreshDetail);stations(function(){if(cur===f)drawMap(LASTLINES)},function(){})}
  if(v=='add'){$('q').value='';$('res').innerHTML='';stations(function(){},function(){})}
}
var backs=document.getElementsByClassName('back');
for(var bi=0;bi<backs.length;bi++)backs[bi].onclick=function(){go('home')};
$('plus').onclick=function(){go('add')};
$('del').onclick=function(){if(confirm('Ukloni stanicu?')){var n=[];for(var i=0;i<favs.length;i++)if(favs[i].uid!=cur.uid)n.push(favs[i]);favs=n;save();go('home')}};

/* ---- obrada linija ---- */
var SEEN={};
function smooth(k,lines){ // linija koja na tren nestane iz API-ja ostaje do 60 s
  var now=Date.now(),m=SEEN[k]||(SEEN[k]={}),here={},i,id;
  for(i=0;i<lines.length;i++){id=lines[i].number+'|'+lines[i].title;here[id]=1;m[id]={l:lines[i],t:now}}
  for(id in m){if(here[id])continue;
    var el=(now-m[id].t)/1000;if(el>60){delete m[id];continue}
    var l=m[id].l,arr=[];
    for(i=0;i<l.arrivals.length;i++){var a=l.arrivals[i],s=a.sec-el;if(s>-30)arr.push({sec:s,stops:a.stops,lat:a.lat,lon:a.lon})}
    if(arr.length)lines.push({number:l.number,title:l.title,arrivals:arr})}
  lines.sort(function(a,b){return a.arrivals[0].sec-b.arrivals[0].sec});
  return lines;
}
function prep(f0,key,raw,all){
  var f=favOf(f0),now=Date.now(),i;
  if(!f.known)f.known=[];if(!f.seen)f.seen={};
  for(i=0;i<raw.length;i++){var n=raw[i].number;if(indexOf(f.known,n)<0)f.known.push(n);f.seen[n]={t:now,title:raw[i].title}}
  if(isFav(f))save();
  var lines=smooth(key,raw),sel=(f.lines&&f.lines.length)?f.lines:null;
  if(sel){
    var out=[];
    for(i=0;i<lines.length;i++)if(indexOf(sel,lines[i].number)>=0)out.push(lines[i]);
    lines=out;
    for(i=0;i<sel.length;i++){var have=false;
      for(var j=0;j<lines.length;j++)if(lines[j].number==sel[i])have=true;
      if(!have){var s=f.seen[sel[i]];lines.push({number:sel[i],title:s?s.title:'',arrivals:[],idle:true,seen:s?s.t:0,rel:(f.rel&&f.rel[sel[i]])||null})}}
  }else if(all&&f.pass){ // bez filtera: na detalju prikaži i sve linije koje prolaze, a nemaju vozilo uživo
    for(i=0;i<f.pass.length;i++){var have2=false;
      for(var j2=0;j2<lines.length;j2++)if(lines[j2].number==f.pass[i])have2=true;
      if(!have2){var s2=f.seen[f.pass[i]];lines.push({number:f.pass[i],title:s2?s2.title:'',arrivals:[],idle:true,seen:s2?s2.t:0,rel:(f.rel&&f.rel[f.pass[i]])||null})}}
  }
  lines.sort(function(a,b){
    if(!!a.idle!==!!b.idle)return a.idle?1:-1;
    return a.idle?nat(a.number,b.number):a.arrivals[0].sec-b.arrivals[0].sec});
  return lines;
}
function mk(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
/* ---- red vožnje (polasci sa početne stanice) za linije bez vozila uživo ---- */
var SCH={};
function pad2(n){return n<10?'0'+n:''+n}
function schedDay(){var w=new Date(Date.now()-3*36e5).getDay();return w===0?'N':(w===6?'S':'R')} // noćni polasci pripadaju prethodnom danu
function nowMin(){var n=Date.now(),d=new Date(n-3*36e5);return Math.floor((n-new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime())/6e4)}
function hhmm(t){return pad2(Math.floor(t/60)%24)+':'+pad2(t%60)}
function isIn(el){while(el){if(el===document.body)return true;el=el.parentNode}return false}
function inTxt(m){return m<1?'sad':'za '+(m<60?m+' min':Math.floor(m/60)+' h '+(m%60)+' min')}
function drawSched(el,data,ctx,l){
  el.innerHTML='';var now=nowMin(),i,j;l=l||{};
  if(!data.dirs||!data.dirs.length){el.textContent='Nema polazaka po rasporedu za ovaj dan.'+(data.note?' ('+data.note+')':'');return}
  var dirs=pickDirs(data.dirs,l);
  if(dirs.length===1&&ctx){ // smer je poznat: jedan polazak, vreme desno kao kod linija uživo
    var d1=dirs[0],nx1;
    for(j=0;j<d1.times.length;j++)if(d1.times[j]>=now){nx1=d1.times[j];break}
    ctx.t.textContent=d1.label||l.title||('Linija '+(l.number||''));
    ctx.sm.textContent='Nema vozila uživo · po rasporedu'+(l.seen?' · viđeno pre '+agoTxt(Math.round((Date.now()-l.seen)/1000)):'');
    if(nx1===undefined){ctx.sp.textContent='—';ctx.es.textContent=d1.times.length?'sutra ~'+hhmm(d1.times[0]):'nema polazaka'}
    else{ctx.sp.textContent=hhmm(nx1);ctx.es.textContent=inTxt(nx1-now)}
    return}
  el.appendChild(mk('div',null,'Po rasporedu, sa početne stanice:'));
  for(i=0;i<dirs.length;i++){
    var d=dirs[i],nx,row=mk('div');
    for(j=0;j<d.times.length;j++)if(d.times[j]>=now){nx=d.times[j];break}
    if(nx===undefined)row.textContent='nema više polazaka danas · '+d.label;
    else{row.appendChild(mk('b',null,hhmm(nx)));
      row.appendChild(document.createTextNode(' ('+inTxt(nx-now)+') · '+d.label))}
    el.appendChild(row);
  }
}
function fillSched(el,num,ctx,l){
  var day=schedDay(),k=num+'|'+day,c=SCH[k];
  if(c&&c.data&&Date.now()-c.t<216e5)return drawSched(el,c.data,ctx,l);
  if(c&&c.err&&Date.now()-c.t<3e5){el.textContent='Raspored nije dostupan ('+c.err+')';return}
  el.textContent='Učitavam raspored…';
  if(!c||!c.w){
    SCH[k]={w:[]};
    api('/api/schedule?city='+CITY+'&line='+encodeURIComponent(num)+'&day='+day,function(d){fin(k,{data:d,t:Date.now()})},function(e){fin(k,{err:String(e),t:Date.now()})});
  }
  SCH[k].w.push([el,num,ctx,l]);
}
function fin(k,res){
  var w=SCH[k].w;SCH[k]=res;
  for(var i=0;i<w.length;i++)if(isIn(w[i][0]))fillSched(w[i][0],w[i][1],w[i][2],w[i][3]);
}
function rows(el,lines,max){
  el.innerHTML='';
  if(!lines.length){el.appendChild(mk('div','msg','Nema nailazećih vozila.'));return}
  for(var i=0;i<lines.length&&i<max;i++){
    var l=lines[i],a=l.arrivals[0],live=!!(a&&a.lat&&a.lon);
    var r=mk('div','row'+(l.idle?' idle':'')),b=mk('div','bullet',l.number);b.style.background=color(l.number);
    var d=mk('div','dest'),t=mk('b'),sm=mk('small'),eta=mk('div','eta'),sp=mk('span'),es=mk('small');
    if(l.idle){
      t.textContent=l.title||'Nema vozila uživo';
      sm.textContent=(l.title?'Nema vozila uživo':'')+(l.seen?(l.title?' · ':'')+'viđeno pre '+agoTxt(Math.round((Date.now()-l.seen)/1000)):'');
      sp.textContent='—';
      var sc=mk('div','sch');d.appendChild(sc);fillSched(sc,l.number,{t:t,sm:sm,sp:sp,es:es},l);
    }else{
      t.textContent=l.title;
      if(l.arrivals.length>1){var z=[];for(var k=1;k<l.arrivals.length&&k<3;k++)z.push(fmt(l.arrivals[k].sec));sm.textContent='Zatim: '+z.join(', ')}
      sp.textContent=fmt(a.sec);
      var dot=mk('i','tr '+(live?'on':'off'));dot.title=live?'Prati se uživo':'Bez GPS signala';
      sp.insertBefore(dot,sp.firstChild);
      es.textContent=a.stops>0?a.stops+(a.stops==1?' stanica':' stanice'):'';
    }
    d.appendChild(t);d.appendChild(sm);eta.appendChild(sp);eta.appendChild(es);
    r.appendChild(b);r.appendChild(d);r.appendChild(eta);el.appendChild(r);
  }
}

/* ---- početni ekran ---- */
function openFav(f){return function(){go('detail',f)}}
function buildHome(){
  var box=$('cards');box.innerHTML='';bodies=[];
  if(!favs.length){box.appendChild(mk('div','msg','Još nema stanica. Pritisni „+ Dodaj“.'));return}

function refreshOne(f,i){
  api('/api/arrivals?city='+CITY+'&uid='+encodeURIComponent(f.uid),function(raw){
    lastOk=Date.now();if(bodies[i])rows(bodies[i],prep(f,'h'+f.uid,raw),(f.lines&&f.lines.length)?f.lines.length:3);renderSync()
  },function(e){if(bodies[i])showErr(bodies[i],e)});
}
function refreshHome(){for(var i=0;i<favs.length;i++)refreshOne(favs[i],i)}

/* ---- pojednostavljena mapa: canvas bez podloge (radi i na iOS 9) ---- */
var MAPON=false,MAP={R:0},LASTLINES=[];
try{MAPON=localStorage.getItem('legacy_map')==='1'}catch(e){}
function setMap(on){MAPON=on;try{localStorage.setItem('legacy_map',on?'1':'0')}catch(e){}
  show('mapbox',on);$('mbtn').style.background=on?'#2a2a2a':'';if(on)drawMap(LASTLINES)}
function geoFor(by,n){return by[n]||by[String(n).toUpperCase()]||[]}
function drawMap(lines){
  if(!MAPON||!cur)return;
  var s=stationOf(cur),cv=$('cv');if(!s||!cv||!cv.getContext)return;
  var box=$('mapbox'),w=box.offsetWidth||320,h=240,dpr=window.devicePixelRatio||1,i,j,k;
  var W=Math.round(w*dpr),H=Math.round(h*dpr);if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
  var c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.fillStyle='#0b0b0b';c.fillRect(0,0,w,h);
  var kx=111320*Math.cos(s.lat*Math.PI/180),ky=110540,buses=[],maxd=0;
  for(i=0;i<lines.length;i++){var a=lines[i].arrivals[0];
    if(a&&a.lat&&a.lon){var dx=(a.lon-s.lon)*kx,dy=(a.lat-s.lat)*ky,d=Math.sqrt(dx*dx+dy*dy);buses.push({n:lines[i].number,x:dx,y:dy});if(d>maxd)maxd=d}}
  if(!MAP.R)MAP.R=Math.max(500,Math.min(3000,Math.round(maxd*1.15/100)*100));
  var sc=(Math.min(w,h)/2-16)/MAP.R,cx=w/2,cy=h/2;
  c.strokeStyle='#222';c.lineWidth=1;c.fillStyle='#555';c.font='10px Helvetica,Arial,sans-serif';
  for(i=1;i<=2;i++){c.beginPath();c.arc(cx,cy,MAP.R*sc*i/2,0,6.2832);c.stroke()}
  c.fillText((MAP.R>=1000?(MAP.R/1000).toFixed(1)+' km':Math.round(MAP.R)+' m'),6,h-6);
  var by=loadGeo(cur.uid),pass;
  c.lineJoin='round';c.lineCap='round';
  if(by)for(pass=0;pass<2;pass++)for(i=0;i<lines.length;i++){var ws=geoFor(by,lines[i].number);
    c.strokeStyle=pass?color(lines[i].number):'#000';c.lineWidth=pass?3:6;
    for(j=0;j<ws.length;j++){var g=ws[j];c.beginPath();
      for(k=0;k<g.length;k++){var x=cx+(g[k][1]-s.lon)*kx*sc,y=cy-(g[k][0]-s.lat)*ky*sc;if(k)c.lineTo(x,y);else c.moveTo(x,y)}
      c.stroke()}}
  c.beginPath();c.arc(cx,cy,6,0,6.2832);c.fillStyle='#fff';c.fill();c.lineWidth=2;c.strokeStyle='#000';c.stroke();
  c.font='bold 10px Helvetica,Arial,sans-serif';c.textAlign='center';c.textBaseline='middle';
  for(i=0;i<buses.length;i++){var bx=cx+buses[i].x*sc,by2=cy-buses[i].y*sc;
    c.beginPath();c.arc(bx,by2,11,0,6.2832);c.fillStyle=color(buses[i].n);c.fill();c.lineWidth=2;c.strokeStyle='#fff';c.stroke();
    c.fillStyle='#fff';c.fillText(String(buses[i].n),bx,by2)}
  c.textAlign='start';c.textBaseline='alphabetic';
}
$('mbtn').onclick=function(){setMap(!MAPON)};
$('zin').onclick=function(){MAP.R=Math.max(200,MAP.R/1.6);drawMap(LASTLINES)};
$('zout').onclick=function(){MAP.R=Math.min(8000,MAP.R*1.6);drawMap(LASTLINES)};
window.onresize=function(){drawMap(LASTLINES)};

/* ---- stanica ---- */
var PASSTRY={};
function refreshDetail(){
  var f=cur;if(!f)return;
  api('/api/arrivals?city='+CITY+'&uid='+encodeURIComponent(f.uid),function(raw){
    if(cur!==f)return;lastOk=Date.now();var L2=prep(f,'d'+f.uid,raw,true);rows($('dlist'),L2,30);LASTLINES=L2;drawMap(L2);renderSync();
    var F=favOf(f);if((!F.pass||F.pv!==PV)&&!PASSTRY[F.uid]){PASSTRY[F.uid]=1;passFor(F,function(){if(cur===f)refreshDetail()})} // učitaj linije koje prolaze
  },function(e){if(cur!==f)return;showErr($('dlist'),e)});
}

/* ---- filter linija ---- */
function renderFlt(){
  var f=favOf(cur),box=$('fl');
  if(!f.pass||f.pv!==PV){
    box.innerHTML='';box.appendChild(mk('div','mut','Tražim linije koje prolaze kroz stanicu…'));
    passFor(f,function(p,err){if(favOf(cur)!==f)return;if(err)f.passErr=err;renderFlt2(f,err)});return;
  }
  renderFlt2(f,'');
}
function renderFlt2(f,err){
  var box=$('fl'),all=(f.known||[]).slice(),known=[],seen={},i;
  var pass=f.pass||[];
  for(i=0;i<pass.length;i++)all.push(pass[i]);
  for(i=0;i<all.length;i++)if(!seen[all[i]]){seen[all[i]]=1;known.push(all[i])}
  known.sort(nat);
  box.innerHTML='';
  if(err)box.appendChild(mk('div','mut','Trase se ne mogu učitati ('+err+'); prikazane su samo linije viđene uživo.'));
  if(!known.length){box.appendChild(mk('div','mut','Nijedna linija nije pronađena za ovu stanicu.'));return}
  var sel=(f.lines&&f.lines.length)?f.lines:known;
  for(var i=0;i<known.length;i++){
    var lab=mk('label','fr'),cb=document.createElement('input');cb.type='checkbox';cb.checked=indexOf(sel,known[i])>=0;
    var b=mk('span','bullet',known[i]);b.style.background=color(known[i]);
    cb.onchange=function(){
      var inputs=box.getElementsByTagName('input'),on=[];
      for(var k=0;k<inputs.length;k++)if(inputs[k].checked)on.push(known[k]);
      f.lines=(on.length==known.length||!on.length)?[]:on; // sve ili ništa = sve linije
      save();renderFlt2(f,err);refreshDetail();
    };
    lab.appendChild(cb);lab.appendChild(b);box.appendChild(lab);
  }
}
$('fbtn').onclick=function(){renderFlt();show('flt',true)};
$('fall').onclick=function(){favOf(cur).lines=[];save();renderFlt();refreshDetail()};$('fclose').onclick=function(){show('flt',false)};

/* ---- dodavanje stanice ---- */
function addFav(s){return function(){if(!isFav(s)){favs.push({city:CITY,uid:s.uid,id:s.id,name:s.name});save()}go('home')}}
$('q').oninput=function(){
  var q=this.value.replace(/^\s+|\s+$/g,'').toLowerCase(),box=$('res');box.innerHTML='';if(!q)return;
