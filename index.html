<!DOCTYPE html>
<html lang="sr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.0.3/leaflet.css">
<style>
@font-face{font-family:Helv;src:url(Helvetica-Bold.ttf);font-weight:100 900}
*{-webkit-box-sizing:border-box;box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font:16px/1.3 Helv,"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
.wrap{padding:12px}
input,button{background:#111;color:#fff;border:1px solid #2a2a2a;border-radius:8px;padding:12px;font:inherit;-webkit-appearance:none}
button{cursor:pointer}
.hd{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:center;align-items:center;padding:6px 0 10px;border-bottom:3px solid #fff}
.hd h1{font-size:22px;margin:0}
.hd button{margin-left:6px;padding:10px 12px}
.mut{color:#9aa0a6}
.sync{font-size:12px;color:#9aa0a6;margin:6px 0}
.card{border-bottom:1px solid #2a2a2a;padding:14px 0}
.card h2{font-size:18px;margin:0 0 8px;display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between}
.card h2 span{color:#9aa0a6;font-size:14px}
.row{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:8px 0}
.big .row{padding:10px 0;border-bottom:1px solid #2a2a2a}
.bullet{-webkit-flex:none;flex:none;min-width:40px;height:40px;border-radius:20px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;font-size:18px;padding:0 8px;color:#fff;margin-right:12px}
.dest{-webkit-flex:1;flex:1;min-width:0}
.dest b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dest small,.eta small{color:#9aa0a6;font-size:12px}
.eta{text-align:right;color:#ffb000;font-size:26px;line-height:1;margin-left:8px;white-space:nowrap}
.eta small{display:block;margin-top:3px}
.row.idle .eta{color:#9aa0a6}
.sch{font-size:12px;color:#9aa0a6;margin-top:3px}
.sch div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sch b{color:#fff}
.tr{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:8px;vertical-align:middle;position:relative;top:-2px}
.tr.on{background:#34c759;-webkit-animation:pl 2s infinite;animation:pl 2s infinite}
.tr.off{border:1.5px solid #9aa0a6}
@-webkit-keyframes pl{0%{box-shadow:0 0 0 0 rgba(52,199,89,.7)}70%{box-shadow:0 0 0 7px rgba(52,199,89,0)}100%{box-shadow:0 0 0 0 rgba(52,199,89,0)}}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(52,199,89,.7)}70%{box-shadow:0 0 0 7px rgba(52,199,89,0)}100%{box-shadow:0 0 0 0 rgba(52,199,89,0)}}
.msg{color:#9aa0a6;padding:24px 0;text-align:center}.err{color:#ff6b6b}
#q{width:100%;margin:10px 0}
.res div{padding:12px 4px;border-bottom:1px solid #2a2a2a}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;z-index:2000;background:rgba(0,0,0,.75);display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
.modal .box{background:#111;border:1px solid #2a2a2a;border-radius:14px;padding:18px;width:90%;max-width:360px;max-height:85%;overflow:auto}
.modal h1{font-size:20px;margin:0 0 10px}
.fr{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:6px 0}
.fr input{width:24px;height:24px;margin:0 12px 0 0;padding:0;-webkit-appearance:checkbox}
.fr .bullet{min-width:34px;height:34px;font-size:15px;margin:0}
.btns{display:-webkit-flex;display:flex;margin-top:12px}
.btns button{-webkit-flex:1;flex:1;margin-right:8px}.btns button:last-child{margin-right:0}

/* detalj: mapa gore preko cele širine, lista linija ispod */
html,body{height:100%;-webkit-tap-highlight-color:transparent}
#detail{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:10;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
#dmap{position:relative;-webkit-flex:1;flex:1;min-height:0;background:#111}
#sheet{position:relative;-webkit-flex:none;flex:none;height:58%;background:#000;border-radius:14px 14px 0 0;z-index:1200;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;overflow:hidden;margin-top:-14px}
@media (orientation:landscape){#sheet{height:62%}}
#detail.min #sheet{height:auto;max-height:72%}
#detail.hide #sheet{display:none}
#detail.hide .tl{display:none}
#shead{-webkit-flex:none;flex:none;display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:center;align-items:center;padding:10px 16px 8px;border-bottom:2px solid #fff}
#shead h1{font-size:20px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#shead .sync{margin:2px 0 0}
#shead>div{min-width:0}
#chev{color:#9aa0a6;font-size:16px;margin-left:12px;padding:6px}
#dlist{-webkit-flex:1;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 12px}
.dbar{position:absolute;top:8px;left:8px;right:8px;z-index:1100;display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;pointer-events:none;-webkit-flex-wrap:wrap;flex-wrap:wrap}
.dbar button{pointer-events:auto;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.22);padding:8px 12px;margin-left:6px;font-size:15px}
#rnote{font-size:11px;color:#ffb000;margin-top:2px}
.dbar button.back{margin-left:0}
.vh b{display:block;width:28px;height:28px;border-radius:14px;border:2px solid #fff;color:#fff;font:bold 12px/24px Helv,Arial,sans-serif;text-align:center;-webkit-box-sizing:border-box;box-sizing:border-box;box-shadow:0 0 6px rgba(0,0,0,.8)}
.leaflet-container{background:#111;font:inherit}
.leaflet-tile-pane{-webkit-filter:brightness(1.7) contrast(1.1);filter:brightness(1.7) contrast(1.1)}
.leaflet-control-attribution{background:rgba(0,0,0,.55)!important;color:#777!important;font-size:9px!important}
</style></head><body><div class="wrap">

<div id="home">
  <div class="hd"><h1>Moje stanice</h1><span><button id="plus">+ Dodaj</button></span></div>
  <div id="hsync" class="sync"></div>
  <div id="cards"></div>
</div>

<div id="add" style="display:none">
  <div class="hd"><h1>Dodaj stanicu</h1><span><button class="back">✕</button></span></div>
  <input id="q" placeholder="Ime ili broj stanice…" autocomplete="off" autocorrect="off" autocapitalize="off">
  <div id="res" class="res"></div>
</div>
</div>
<div id="detail" style="display:none">
  <div id="dmap"></div>
  <div class="dbar"><button class="back tl">←</button><span><button id="szm" class="tl">A−</button><button id="szp" class="tl">A+</button><button id="fbtn" class="tl">Linije</button><button id="del" class="tl">Ukloni</button><button id="hui">Sakrij</button></span></div>
  <div id="sheet">
    <div id="shead"><div><h1 id="dname"></h1><div id="dsync" class="sync"></div><div id="rnote"></div></div><span id="chev">▾</span></div>
    <div id="dlist" class="big"></div>
  </div>
</div>

<div id="flt" class="modal" style="display:none"><div class="box"><h1>Linije na stanici</h1>
  <div class="mut" style="font-size:14px;margin-bottom:8px">Sve linije koje prolaze kroz stanicu (po OpenStreetMap-u, plus viđene uživo). Ako ništa ne menjaš, prikazuju se sve.</div>
  <div id="fl"></div>
  <div class="btns"><button id="fall">Prikaži sve</button><button id="fclose">Gotovo</button></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.0.3/leaflet.js"></script>
<script>
var API='https://nycbus.stevan-gajinov5.workers.dev',CITY='ns',REFRESH=15000;
var COLORS=['#0039a6','#ff6319','#6cbe45','#b933ad','#ee352e','#00933c','#00add0','#996633','#fccc0a','#e6007e','#1b998b','#7a5195','#f2542d','#3a86ff'];
function $(id){return document.getElementById(id)}
function show(id,on){$(id).style.display=on?'':'none'}
function color(n){var h=0,s=norm(n);for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%997;return COLORS[h%COLORS.length]}
function fmt(s){return s<60?'sad':Math.round(s/60)+' min'}
function agoTxt(s){return s<60?s+' s':Math.floor(s/60)+' min'}
function nat(a,b){var x=parseInt(a,10),y=parseInt(b,10);if(!isNaN(x)&&!isNaN(y)&&x!==y)return x-y;return a<b?-1:(a>b?1:0)}
function indexOf(a,v){for(var i=0;i<a.length;i++)if(a[i]==v)return i;return -1}

/* ćirilica → latinica, da se "7А" / "55НК" iz OSM-a poklope sa "7A" / "55NK" iz API-ja */
var TR={'А':'A','Б':'B','В':'V','Г':'G','Д':'D','Е':'E','Ж':'Z','З':'Z','И':'I','Ј':'J','К':'K','Л':'L','М':'M','Н':'N','О':'O','П':'P','Р':'R','С':'S','Т':'T','У':'U','Ф':'F','Х':'H','Ц':'C','Ч':'C','Ш':'S'};
function norm(s){return String(s).toUpperCase().replace(/[А-Ш]/g,function(c){return TR[c]||c}).replace(/[^0-9A-Z]/g,'')}
function indexOfN(a,v){var n=norm(v);for(var i=0;i<a.length;i++)if(norm(a[i])===n)return i;return -1}

/* XHR umesto fetch-a (iOS 9 nema fetch) */
function api(path,ok,fail,t){
  var x=new XMLHttpRequest();x.open('GET',API+path,true);x.timeout=t||15000;
  x.onload=function(){var j;try{j=JSON.parse(x.responseText)}catch(e){fail('neispravan odgovor');return}
    if(x.status>=200&&x.status<300)ok(j);else fail((j&&j.error)||x.status)};
  x.onerror=function(){fail('mreža – nema veze sa serverom (proveri internet ili HTTPS sertifikat)')};x.ontimeout=function(){fail('vreme isteklo')};
  x.send();
}
function showErr(el,e){
  el.innerHTML='';var m=document.createElement('div');m.className='msg err';m.textContent='Greška: '+e;el.appendChild(m);
  if(String(e).indexOf('mreža')===0){
    var a=document.createElement('a');a.href=API+'/api/cities';a.target='_blank';a.style.color='#ffb000';
    a.textContent='Dodirni da testiraš vezu sa serverom';var p=document.createElement('div');p.className='msg';p.appendChild(a);el.appendChild(p)}
}
/* Overpass (OpenStreetMap): rezervni put ako Worker ne radi */
var OVP=['https://overpass-api.de/api/interpreter','https://overpass.private.coffee/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
function overpass(q,ok,fail,i,t){
  i=i||0;if(i>=OVP.length)return fail('Overpass nedostupan');
  var x=new XMLHttpRequest();x.open('POST',OVP[i],true);x.timeout=t||30000;
  x.setRequestHeader('Content-Type','application/x-www-form-urlencoded');
  x.onload=function(){var j;try{j=JSON.parse(x.responseText)}catch(e){return overpass(q,ok,fail,i+1,t)}
    if(x.status>=200&&x.status<300)ok(j);else overpass(q,ok,fail,i+1,t)};
  x.onerror=x.ontimeout=function(){overpass(q,ok,fail,i+1,t)};
  x.send('data='+encodeURIComponent(q));
}
function hasPass(f){return !!(f.pass&&f.pass.length)}
function passFor(f,cb){
  if(hasPass(f))return cb(f.pass,'');
  stations(function(sts){
    var s=null;for(var i=0;i<sts.length;i++)if(sts[i].uid==f.uid)s=sts[i];
    if(!s)return cb([],'stanica nije pronađena');
    var q='[out:json][timeout:25];way(around:35,'+s.lat+','+s.lon+')->.w;rel(bw.w)["route"~"^(bus|trolleybus)$"];out tags;';
    overpass(q,function(j){
      var set={},out=[],el=j.elements||[];
      for(var k=0;k<el.length;k++){var r=el[k].tags&&el[k].tags.ref;if(!r)continue;r=norm(r);if(r&&!set[r]){set[r]=1;out.push(r)}}
      out.sort(nat);if(out.length){f.pass=out;save()}cb(out,'');
    },function(e){cb([],e)});
  },function(e){cb([],e)});
}
var ST=null,stQ=[];
function stations(cb,fail){
  if(ST)return cb(ST);
  stQ.push([cb,fail]);if(stQ.length>1)return;
  api('/api/stations?city='+CITY,function(j){ST=j;var q=stQ;stQ=[];for(var i=0;i<q.length;i++)q[i][0](ST)},
    function(e){var q=stQ;stQ=[];for(var i=0;i<q.length;i++)q[i][1](e)});
}
var favs=[];
try{var raw=JSON.parse(localStorage.getItem('favs')||'[]');for(var i=0;i<raw.length;i++)if((raw[i].city||CITY)==CITY)favs.push(raw[i])}catch(e){}
function save(){try{localStorage.setItem('favs',JSON.stringify(favs))}catch(e){}}
/* jednokratna migracija: stari (prazni / ćirilični) keš linija i trasa se briše */
(function(){var ch=false;
  for(var i=0;i<favs.length;i++)if(favs[i].pv!==2){delete favs[i].pass;favs[i].pv=2;ch=true}
  if(ch)save();
  try{for(var k=localStorage.length-1;k>=0;k--){var nm=localStorage.key(k);if(nm&&nm.indexOf('rt_')===0){var c=JSON.parse(localStorage.getItem(nm)||'null');if(!c||c.v!==2)localStorage.removeItem(nm)}}}catch(e){}
})();
function favOf(f){for(var i=0;i<favs.length;i++)if(favs[i].uid==f.uid)return favs[i];return f}
function isFav(f){for(var i=0;i<favs.length;i++)if(favs[i].uid==f.uid)return true;return false}

var cur=null,timer=null,bodies=[],lastOk=0,nextAt=0;

/* ---- status sinhronizacije ---- */
function renderSync(){
  var t;
  if(!lastOk)t='Učitavam…';
  else{var ago=Math.max(0,Math.round((Date.now()-lastOk)/1000)),left=Math.max(0,Math.ceil((nextAt-Date.now())/1000));
    t='Sinhronizovano pre '+agoTxt(ago)+' · osvežavanje '+(left?'za '+left+' s':'…')}
  $('hsync').textContent=t;$('dsync').textContent=t;
}
setInterval(renderSync,1000);
function startTimer(fn){
  if(timer)clearInterval(timer);nextAt=Date.now()+REFRESH;
  timer=setInterval(function(){nextAt=Date.now()+REFRESH;fn()},REFRESH);renderSync();
}

function go(v,f){
  cur=f||null;if(timer){clearInterval(timer);timer=null}lastOk=0;
  show('home',v=='home');show('add',v=='add');show('detail',v=='detail');
  if(v=='home'){buildHome();startTimer(refreshHome)}
  if(v=='detail'){active=null;DS.raw=null;$('detail').className='';$('hui').textContent='Sakrij';$('rnote').textContent='';$('chev').textContent='▾';$('dname').textContent=f.name;$('dlist').innerHTML='';initMap(f);refreshDetail();startTimer(refreshDetail)}
  if(v=='add'){$('q').value='';$('res').innerHTML='';stations(function(){},function(){})}
}
var backs=document.getElementsByClassName('back');
for(var bi=0;bi<backs.length;bi++)backs[bi].onclick=function(){go('home')};
$('plus').onclick=function(){go('add')};
$('del').onclick=function(){if(confirm('Ukloni stanicu?')){var n=[];for(var i=0;i<favs.length;i++)if(favs[i].uid!=cur.uid)n.push(favs[i]);favs=n;save();go('home')}};

/* ---- obrada linija ---- */
var SEEN={};
function smooth(k,lines){ // linija koja na tren nestane iz API-ja ostaje do 60 s
  var now=Date.now(),m=SEEN[k]||(SEEN[k]={}),here={},i,id;
  for(i=0;i<lines.length;i++){id=lines[i].number+'|'+lines[i].title;here[id]=1;m[id]={l:lines[i],t:now}}
  for(id in m){if(here[id])continue;
    var el=(now-m[id].t)/1000;if(el>60){delete m[id];continue}
    var l=m[id].l,arr=[];
    for(i=0;i<l.arrivals.length;i++){var a=l.arrivals[i],s=a.sec-el;if(s>-30)arr.push({sec:s,stops:a.stops,lat:a.lat,lon:a.lon})}
    if(arr.length)lines.push({number:l.number,title:l.title,arrivals:arr})}
  lines.sort(function(a,b){return a.arrivals[0].sec-b.arrivals[0].sec});
  return lines;
}
function seenFor(f,n){var k=norm(n);for(var x in f.seen)if(norm(x)===k)return f.seen[x];return null}
function prep(f0,key,raw,all){
  var f=favOf(f0),now=Date.now(),i,j;
  if(!f.known)f.known=[];if(!f.seen)f.seen={};
  for(i=0;i<raw.length;i++){var n=raw[i].number;if(indexOf(f.known,n)<0)f.known.push(n);f.seen[n]={t:now,title:raw[i].title}}
  if(isFav(f))save();
  var lines=smooth(key,raw),sel=(f.lines&&f.lines.length)?f.lines:null;
  if(sel){
    var out=[];
    for(i=0;i<lines.length;i++)if(indexOfN(sel,lines[i].number)>=0)out.push(lines[i]);
    lines=out;
    for(i=0;i<sel.length;i++){var have=false;
      for(j=0;j<lines.length;j++)if(norm(lines[j].number)===norm(sel[i]))have=true;
      if(!have){var s=seenFor(f,sel[i]);lines.push({number:sel[i],title:s?s.title:'',arrivals:[],idle:true,seen:s?s.t:0})}}
  }else if(all&&hasPass(f)){ // bez filtera: na detalju prikaži i sve linije koje prolaze, a nemaju vozilo uživo
    for(i=0;i<f.pass.length;i++){var have2=false;
      for(j=0;j<lines.length;j++)if(norm(lines[j].number)===norm(f.pass[i]))have2=true;
      if(!have2){var s2=seenFor(f,f.pass[i]);lines.push({number:f.pass[i],title:s2?s2.title:'',arrivals:[],idle:true,seen:s2?s2.t:0})}}
  }
  lines.sort(function(a,b){
    if(!!a.idle!==!!b.idle)return a.idle?1:-1;
    return a.idle?nat(a.number,b.number):a.arrivals[0].sec-b.arrivals[0].sec});
  return lines;
}
function mk(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
/* ---- red vožnje (polasci sa početne stanice) za linije bez vozila uživo ---- */
var SCH={};
function pad2(n){return n<10?'0'+n:''+n}
function schedDay(){var w=new Date(Date.now()-3*36e5).getDay();return w===0?'N':(w===6?'S':'R')}
function nowMin(){var n=Date.now(),d=new Date(n-3*36e5);return Math.floor((n-new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime())/6e4)}
function hhmm(t){return pad2(Math.floor(t/60)%24)+':'+pad2(t%60)}
function isIn(el){while(el){if(el===document.body)return true;el=el.parentNode}return false}
function drawSched(el,data){
  el.innerHTML='';var now=nowMin(),i,j;
  if(!data.dirs||!data.dirs.length){el.textContent='Nema polazaka po rasporedu za ovaj dan.'+(data.note?' ('+data.note+')':'');return}
  el.appendChild(mk('div',null,'Po rasporedu, sa početne stanice:'));
  for(i=0;i<data.dirs.length;i++){
    var d=data.dirs[i],nx,row=mk('div');
    for(j=0;j<d.times.length;j++)if(d.times[j]>=now){nx=d.times[j];break}
    if(nx===undefined)row.textContent='nema više polazaka danas · '+d.label;
    else{var m=nx-now;row.appendChild(mk('b',null,hhmm(nx)));
      row.appendChild(document.createTextNode(' ('+(m<1?'sad':'za '+(m<60?m+' min':Math.floor(m/60)+' h '+(m%60)+' min'))+') · '+d.label))}
    el.appendChild(row);
  }
}
function fillSched(el,num){
  var day=schedDay(),k=num+'|'+day,c=SCH[k];
  if(c&&c.data&&Date.now()-c.t<216e5)return drawSched(el,c.data);
  if(c&&c.err&&Date.now()-c.t<3e5){el.textContent='Raspored nije dostupan ('+c.err+')';return}
  el.textContent='Učitavam raspored…';
  if(!c||!c.w){
    SCH[k]={w:[]};
    api('/api/schedule?city='+CITY+'&line='+encodeURIComponent(num)+'&day='+day,function(d){fin(k,{data:d,t:Date.now()})},function(e){fin(k,{err:String(e),t:Date.now()})});
  }
  SCH[k].w.push([el,num]);
}
function fin(k,res){
  var w=SCH[k].w;SCH[k]=res;
  for(var i=0;i<w.length;i++)if(isIn(w[i][0]))fillSched(w[i][0],w[i][1]);
}
var active=null,DS={raw:null};
function pickRow(n,fn){return function(){fn(n)}}
function rows(el,lines,max,onclick){
  el.innerHTML='';
  if(!lines.length){el.appendChild(mk('div','msg','Nema nailazećih vozila.'));return}
  for(var i=0;i<lines.length&&i<max;i++){
    var l=lines[i],a=l.arrivals[0],live=!!(a&&a.lat&&a.lon);
    var r=mk('div','row'+(l.idle?' idle':'')),b=mk('div','bullet',l.number);b.style.background=color(l.number);
    var d=mk('div','dest'),t=mk('b'),sm=mk('small'),eta=mk('div','eta'),sp=mk('span'),es=mk('small');
    if(l.idle){
      t.textContent=l.title||'Nema vozila uživo';
      sm.textContent=(l.title?'Nema vozila uživo':'')+(l.seen?(l.title?' · ':'')+'viđeno pre '+agoTxt(Math.round((Date.now()-l.seen)/1000)):'');
      sp.textContent='—';
      var sc=mk('div','sch');d.appendChild(sc);fillSched(sc,l.number);
    }else{
      t.textContent=l.title;
      if(l.arrivals.length>1){var z=[];for(var k=1;k<l.arrivals.length&&k<3;k++)z.push(fmt(l.arrivals[k].sec));sm.textContent='Zatim: '+z.join(', ')}
      sp.textContent=fmt(a.sec);
      var dot=mk('i','tr '+(live?'on':'off'));dot.title=live?'Prati se uživo':'Bez GPS signala';
      sp.insertBefore(dot,sp.firstChild);
      es.textContent=a.stops>0?a.stops+(a.stops==1?' stanica':' stanice'):'';
    }
    d.appendChild(t);d.appendChild(sm);eta.appendChild(sp);eta.appendChild(es);
    r.appendChild(b);r.appendChild(d);r.appendChild(eta);
    if(onclick)r.onclick=pickRow(l.number,onclick);
    if(active&&active!==l.number)r.style.opacity=.4;
    el.appendChild(r);
  }
}

/* ---- početni ekran ---- */
function openFav(f){return function(){go('detail',f)}}
function buildHome(){
  var box=$('cards');box.innerHTML='';bodies=[];
  if(!favs.length){box.appendChild(mk('div','msg','Još nema stanica. Pritisni „+ Dodaj“.'));return}
  for(var i=0;i<favs.length;i++){
    var c=mk('div','card'),h=mk('h2'),b=mk('b',null,favs[i].name),s=mk('span',null,'#'+favs[i].id),body=mk('div','body mut','učitavam…');
    h.appendChild(b);h.appendChild(s);c.appendChild(h);c.appendChild(body);c.onclick=openFav(favs[i]);
    box.appendChild(c);bodies.push(body);
  }
  refreshHome();
}
function refreshOne(f,i){
  api('/api/arrivals?city='+CITY+'&uid='+encodeURIComponent(f.uid),function(raw){
    lastOk=Date.now();if(bodies[i])rows(bodies[i],prep(f,'h'+f.uid,raw),(f.lines&&f.lines.length)?f.lines.length:3);renderSync()
  },function(e){if(bodies[i])showErr(bodies[i],e)});
}
function refreshHome(){for(var i=0;i<favs.length;i++)refreshOne(favs[i],i)}

/* ---- stanica ---- */
var PASSTRY={};
function refreshDetail(){
  var f=cur;if(!f)return;
  api('/api/arrivals?city='+CITY+'&uid='+encodeURIComponent(f.uid),function(raw){
    if(cur!==f)return;lastOk=Date.now();DS.raw=raw;renderDetail();renderSync();
  },function(e){if(cur!==f)return;showErr($('dlist'),e)});
}
function renderDetail(){
  var f=cur;if(!f||!DS.raw)return;
  var lines=prep(f,'d'+f.uid,DS.raw,true),mn=$('detail').classList.contains('min');
  // spušteno: samo prve 3 linije, ili linije izabrane u podešavanjima (Linije)
  rows($('dlist'),lines,mn?((f.lines&&f.lines.length)?f.lines.length:3):30,pickLine);
  drawMap(lines);
}
function pickLine(n){active=(active===n)?null:n;renderDetail()}
$('shead').onclick=function(){var d=$('detail'),m=!d.classList.contains('min');
  if(m)d.classList.add('min');else d.classList.remove('min');
  $('chev').textContent=m?'▴':'▾';renderDetail();fixMap()};
$('hui').onclick=function(){var d=$('detail'),h=!d.classList.contains('hide');
  if(h)d.classList.add('hide');else d.classList.remove('hide');
  this.textContent=h?'Prikaži':'Sakrij';fixMap()};
/* veličina: A− / A+ uvećava listu (linije + vreme dolaska), trasu i oznake vozila */
var UIS=[.8,1,1.25,1.5,1.8],UI=(function(){var v=1;try{v=parseInt(localStorage.getItem('uis')||'1',10)}catch(e){}return (v>=0&&v<UIS.length)?v:1})();
function applyUI(){$('dlist').style.zoom=UIS[UI];rkey='';try{localStorage.setItem('uis',String(UI))}catch(e){}renderDetail()}
$('szm').onclick=function(){if(UI>0){UI--;applyUI()}};
$('szp').onclick=function(){if(UI<UIS.length-1){UI++;applyUI()}};
$('dlist').style.zoom=UIS[UI];

/* ---- mapa (tamna, samo trase i vozila, bez stanica) ---- */
var MAP=null,RL=null,VL=null,SL=null,STN=null,rkey='',fitted=false,ROUTES={},TILES='https://basemaps.cartocdn.com/rastertiles/dark_nolabels/{z}/{x}/{y}.png?key=cb1_4vk4_1_3316dc936e4b6732f3d7f1ee';
function esc(t){return String(t).replace(/[&<>"]/g,'')}
function fixMap(){if(MAP)setTimeout(function(){MAP.invalidateSize()},60)}
window.addEventListener('resize',fixMap);window.addEventListener('orientationchange',function(){setTimeout(fixMap,250)});
function initMap(f){
  if(!window.L){$('rnote').textContent='Mapa se nije učitala (Leaflet nedostupan)';return}
  stations(function(sts){
    var s=null,i;for(i=0;i<sts.length;i++)if(sts[i].uid==f.uid)s=sts[i];
    if(!s||cur!==f)return;
    if(!MAP){
      MAP=L.map('dmap',{zoomControl:false,attributionControl:false,zoomAnimation:false,fadeAnimation:false,markerZoomAnimation:false});
      L.tileLayer(TILES,{maxZoom:19}).addTo(MAP);
      L.control.attribution({prefix:false}).addAttribution('© OpenStreetMap © CARTO').addTo(MAP);
      RL=L.layerGroup().addTo(MAP);VL=L.layerGroup().addTo(MAP);SL=L.layerGroup().addTo(MAP);
    }else{RL.clearLayers();VL.clearLayers();SL.clearLayers()}
    MAP.invalidateSize();STN=s;rkey='';fitted=false;
    MAP.setView([s.lat,s.lon],15,{animate:false});
    L.circleMarker([s.lat,s.lon],{radius:6,color:'#fff',weight:2,fillColor:'#000',fillOpacity:1,interactive:false}).addTo(SL);
    loadRoutes(f,s,function(err){
      if(cur!==f)return;
      var F=favOf(f);
      if(err&&!hasPass(F)&&!PASSTRY[F.uid]){PASSTRY[F.uid]=1;passFor(F,function(){if(cur===f)renderDetail()});return}
      renderDetail();
    });
  },function(){});
}
function parseRoutes(f,j,done){
  var R={},done1={},pass=[],pset={},el=j.elements||[],a,m,g,p,last,la,lo,ref,arr,mem,key;
  for(a=0;a<el.length;a++){
    ref=el[a].tags&&el[a].tags.ref;if(!ref)continue;
    ref=norm(ref);if(!ref)continue;
    if(!pset[ref]){pset[ref]=1;pass.push(ref)}
    arr=R[ref]||(R[ref]=[]);mem=el[a].members||[];
    for(m=0;m<mem.length;m++){
      if(mem[m].type!=='way'||!mem[m].geometry||/platform|stop/.test(mem[m].role||''))continue;
      key=ref+'|'+mem[m].ref;if(done1[key])continue;done1[key]=1;
      g=mem[m].geometry;p=[];last=null;
      for(var q2=0;q2<g.length;q2++){
        la=Math.round(g[q2].lat*1e5)/1e5;lo=Math.round(g[q2].lon*1e5)/1e5;
        if(last&&q2<g.length-1&&Math.abs(la-last[0])<.00007&&Math.abs(lo-last[1])<.00007)continue;
        last=[la,lo];p.push(last);
      }
      if(p.length>1)arr.push(p);
    }
  }
  pass.sort(nat);
  if(pass.length){ // prazan rezultat se nikad ne pamti
    ROUTES[f.uid]=R;
    try{localStorage.setItem('rt_'+f.uid,JSON.stringify({v:2,t:Date.now(),r:R}))}catch(e){}
    var F=favOf(f);F.pass=pass;F.pv=2;save();
  }
  done();
}
function loadRoutes(f,s,done){
  if(ROUTES[f.uid])return done();
  try{var c=JSON.parse(localStorage.getItem('rt_'+f.uid)||'null');
    if(c&&c.v===2&&Date.now()-c.t<864e5){ROUTES[f.uid]=c.r;return done()}}catch(e){}
  var note=$('rnote');note.textContent='Učitavam trase…';
  function fin(err){
    if(!err&&!ROUTES[f.uid])err='OpenStreetMap nema linije oko ove stanice';
    if(cur===f)note.textContent=err?('Trase nisu dostupne ('+err+')'):'';
    done(err);
  }
  // 1) preko tvog Cloudflare servera
  api('/api/overpass?lat='+s.lat+'&lon='+s.lon,function(j){parseRoutes(f,j,function(){fin()})},function(e1){
    // 2) direktno sa Overpass-a
    var q='[out:json][timeout:40];way(around:35,'+s.lat+','+s.lon+')->.w;rel(bw.w)["route"~"^(bus|trolleybus)$"];out geom;';
    overpass(q,function(j){parseRoutes(f,j,function(){fin()})},function(e2){fin(String(e1)+' / '+String(e2))},0,45000);
  },60000);
}
function drawMap(lines){
  if(!MAP||!STN||!cur)return;
  var R=ROUTES[cur.uid]||{},refs=[],i,k,pass2,n,ws,dim;
  for(i=0;i<lines.length;i++)refs.push(lines[i].number);
  var key=refs.join(',')+'|'+active+'|'+UI+'|'+(ROUTES[cur.uid]?1:0);
  if(key!==rkey){
    rkey=key;RL.clearLayers();
    for(pass2=0;pass2<2;pass2++)for(i=0;i<refs.length;i++){ // prvo prigušene, pa istaknute preko njih
      n=refs[i];dim=!!active&&active!==n;if((pass2===0)!==dim)continue;
      ws=R[norm(n)]||[];
      for(k=0;k<ws.length;k++)L.polyline(ws[k],{color:color(n),weight:Math.round((dim?3:5)*UIS[UI]),opacity:dim?.25:.9,interactive:false,smoothFactor:2,lineCap:'round',lineJoin:'round'}).addTo(RL);
    }
  }
  VL.clearLayers();
  var pts=[],raw=DS.raw||[],l,a,mk2;
  for(i=0;i<raw.length;i++){l=raw[i];if(indexOf(refs,l.number)<0)continue;
    for(k=0;k<l.arrivals.length;k++){a=l.arrivals[k];if(!(a.lat&&a.lon))continue;
      var sz=Math.round(28*UIS[UI]);
      mk2=L.marker([a.lat,a.lon],{icon:L.divIcon({className:'vh',html:'<b style="background:'+color(l.number)+';width:'+sz+'px;height:'+sz+'px;border-radius:'+(sz/2)+'px;font-size:'+Math.round(12*UIS[UI])+'px;line-height:'+(sz-4)+'px">'+esc(l.number)+'</b>',iconSize:[sz,sz]}),interactive:false,keyboard:false,zIndexOffset:500});
      if(active&&active!==l.number)mk2.setOpacity(.3);
      mk2.addTo(VL);pts.push([a.lat,a.lon]);
    }}
  if(!fitted&&pts.length){fitted=true;
    var c0=L.latLng(STN.lat,STN.lon),b=L.latLngBounds([c0,c0]);
    for(i=0;i<pts.length;i++)if(c0.distanceTo(L.latLng(pts[i]))<4000)b.extend(pts[i]);
    MAP.fitBounds(b,{padding:[34,34],maxZoom:15,animate:false});
  }
}

/* ---- filter linija ---- */
function renderFlt(){
  var f=favOf(cur),box=$('fl');
  if(!hasPass(f)){
    box.innerHTML='';box.appendChild(mk('div','mut','Tražim linije koje prolaze kroz stanicu…'));
    passFor(f,function(p,err){if(favOf(cur)!==f)return;renderFlt2(f,err)});return;
  }
  renderFlt2(f,'');
}
function renderFlt2(f,err){
  var box=$('fl'),all=(f.known||[]).slice(),known=[],seen={},i;
  var pass=f.pass||[];
  for(i=0;i<pass.length;i++)all.push(pass[i]);
  for(i=0;i<all.length;i++){var nk=norm(all[i]);if(!seen[nk]){seen[nk]=1;known.push(all[i])}}
  known.sort(nat);
  box.innerHTML='';
  if(err)box.appendChild(mk('div','mut','Trase se ne mogu učitati ('+err+'); prikazane su samo linije viđene uživo.'));
  if(!known.length){box.appendChild(mk('div','mut','Nijedna linija nije pronađena za ovu stanicu.'));return}
  var sel=(f.lines&&f.lines.length)?f.lines:known;
  for(var i2=0;i2<known.length;i2++){
    var lab=mk('label','fr'),cb=document.createElement('input');cb.type='checkbox';cb.checked=indexOfN(sel,known[i2])>=0;
    var b=mk('span','bullet',known[i2]);b.style.background=color(known[i2]);
    cb.onchange=function(){
      var inputs=box.getElementsByTagName('input'),on=[];
      for(var k=0;k<inputs.length;k++)if(inputs[k].checked)on.push(known[k]);
      f.lines=(on.length==known.length||!on.length)?[]:on; // sve ili ništa = sve linije
      save();renderFlt2(f,err);refreshDetail();
    };
    lab.appendChild(cb);lab.appendChild(b);box.appendChild(lab);
  }
}
$('fbtn').onclick=function(){renderFlt();show('flt',true)};
$('fall').onclick=function(){favOf(cur).lines=[];save();renderFlt();refreshDetail()};$('fclose').onclick=function(){show('flt',false)};

/* ---- dodavanje stanice ---- */
function addFav(s){return function(){if(!isFav(s)){favs.push({city:CITY,uid:s.uid,id:s.id,name:s.name,pv:2});save()}go('home')}}
$('q').oninput=function(){
  var q=this.value.replace(/^\s+|\s+$/g,'').toLowerCase(),box=$('res');box.innerHTML='';if(!q)return;
  box.appendChild(mk('div','mut','Učitavam stanice…'));
  stations(function(sts){
    if($('q').value.replace(/^\s+|\s+$/g,'').toLowerCase()!==q)return;
    box.innerHTML='';var n=0;
    for(var i=0;i<sts.length&&n<30;i++){var s=sts[i];
      if(s.name.toLowerCase().indexOf(q)>=0||String(s.id).toLowerCase()==q){
        var d=mk('div'),b=mk('b',null,s.name),sm=mk('small','mut',' #'+s.id);d.appendChild(b);d.appendChild(sm);d.onclick=addFav(s);box.appendChild(d);n++}}
    if(!n)box.appendChild(mk('div','mut','Nema rezultata.'));
  },function(e){showErr(box,e)});
};

go('home');if(!favs.length)go('add');
